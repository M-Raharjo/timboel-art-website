name: Sync Images Drive → S3

# Google Drive is the source of truth.
# idCloudHost S3 is the public mirror used by other applications.

on:
  # Run automatically every hour.
  schedule:
    - cron: "0 * * * *"

  # Also allow manual execution from GitHub Actions.
  workflow_dispatch:

concurrency:
  group: drive-to-s3-sync
  cancel-in-progress: false

jobs:
  sync-rclone:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ------------------------------------------------------------
      # Install rclone
      # ------------------------------------------------------------

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      # ------------------------------------------------------------
      # Build rclone configuration
      #
      # Configuration is kept here where we can actually read it.
      # Only credentials/tokens live in GitHub Secrets.
      # ------------------------------------------------------------

      - name: Create rclone config
        env:
          GOOGLE_TOKEN: ${{ secrets.RCLONE_GOOGLE_TOKEN }}
          S3_ACCESS_KEY: ${{ secrets.IDCLOUDHOST_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.IDCLOUDHOST_S3_SECRET_KEY }}
          DRIVE_CLIENT_ID: ${{ secrets.RCLONE_GOOGLE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_GOOGLE_CLIENT_SECRET }}
        run: |
          cat > rclone.conf <<EOF

          [timboel-foto-gdrive]
          type = drive
          scope = drive
          token = ${GOOGLE_TOKEN}
          team_drive = 0AI6Y32u1RWRnUk9PVA
          root_folder_id = 
          client_id = ${DRIVE_CLIENT_ID}
          client_secret = ${DRIVE_CLIENT_SECRET}

          [image-timboel]
          type = s3
          provider = Other
          access_key_id = ${S3_ACCESS_KEY}
          secret_access_key = ${S3_SECRET_KEY}
          env_auth = false
          endpoint = https://is3.cloudhost.id
          EOF

      # ------------------------------------------------------------
      # Verify both remotes are reachable
      # ------------------------------------------------------------

      - name: Test Google Drive
        env:
          RCLONE_CONFIG: rclone.conf
        run: |
          rclone lsd timboel-foto-gdrive:

      - name: Test idCloudHost S3
        env:
          RCLONE_CONFIG: rclone.conf
        run: |
          rclone lsd image-timboel:

      # ------------------------------------------------------------
      # Mirror Drive public_folder → S3 product-img
      # ------------------------------------------------------------

      - name: Sync Google Drive → idCloudHost S3
        env:
          RCLONE_CONFIG: rclone.conf
        run: |
          rclone sync \
            timboel-foto-gdrive:public_folder \
            image-timboel:image-timboel/product-img \
            --s3-acl public-read \
            --header-upload "Cache-Control: public, max-age=3600" \
            --fast-list \
            - v \
            --stats 30s \
            --stats-one-line